<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AsmPerfect 86</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23306998'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='14' font-weight='bold' fill='white' text-anchor='middle'%3E86%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="brand">AsmPerfect <span>86</span></div>
      <div class="group">
        <select id="examples" title="打开示例程序">
          <option value="">示例程序…</option>
        </select>
        <button id="btn-open" title="打开 .asm 文件到当前编辑器">打开</button>
        <button id="btn-save" title="保存当前编辑器为 .asm 文件">保存</button>
      </div>
      <div class="group">
        <select id="mode" title="单机，或者两台机器用串口线连接">
          <option value="single">单机</option>
          <option value="dual">双机（串口连接）</option>
        </select>
        <select id="cpu" title="CPU 型号：决定虚拟 CPU 的速度；286/386 下 PUSH SP 等少数指令的行为与 8086 不同"></select>
      </div>
      <div class="group">
        <button id="btn-assemble" title="汇编并装载 (F7)">汇编</button>
        <button id="btn-run" class="primary" title="运行 (F5)">▶ 运行</button>
        <button id="btn-pause" title="暂停 (F6)">❚❚ 暂停</button>
        <select id="speed" title="运行速度">
          <option value="-1" selected>原机速度</option>
          <option value="0">全速</option>
          <option value="100">每秒 100 步</option>
          <option value="20">每秒 20 步</option>
          <option value="5">每秒 5 步</option>
          <option value="1">每秒 1 步</option>
        </select>
      </div>
      <div class="group">
        <button id="btn-back" title="后退一步 (Shift+F11)">⟲ 后退</button>
        <button id="btn-step" title="单步进入 (F11)">↓ 单步</button>
        <button id="btn-over" title="单步跳过：CALL / INT / LOOP 整体执行 (F10)">↷ 跳过</button>
        <button id="btn-reset" title="重新开始 (Ctrl+F5)">⟳ 重启</button>
      </div>
      <div class="group">
        <label class="check" title="在每行代码后面显示地址和机器码"><input type="checkbox" id="show-bytes" /> 机器码</label>
      </div>
      <div class="spacer"></div>
      <div id="status" class="status">就绪</div>
    </header>

    <main class="layout">
      <section class="pane editor-pane">
        <div class="pane-head ed-head">
          <div id="ed-tabs" class="ed-tabs"></div>
          <span id="dirty-note" class="note"></span>
        </div>
        <div id="editor"></div>
      </section>

      <section class="pane screen-pane">
        <div class="screens">
          <div class="screen-box" data-i="0">
            <div class="pane-head">
              <span class="screen-title">DOS 屏幕</span>
              <span class="note screen-hint">点击屏幕后可以直接用键盘输入</span>
              <span class="spacer"></span>
              <label class="check" title="像 UCDOS 等中文 DOS 那样，把 GBK 编码显示成汉字"><input type="checkbox" class="cn-toggle" /> 中文</label>
              <input class="cmdline" placeholder="命令行参数" title="程序的命令行参数（PSP:81h）" />
            </div>
            <div class="screen-wrap"><div class="screen" tabindex="0"></div></div>
          </div>
          <div class="screen-box hidden" data-i="1">
            <div class="pane-head">
              <span class="screen-title">B 机屏幕</span>
              <span class="spacer"></span>
              <label class="check" title="像 UCDOS 等中文 DOS 那样，把 GBK 编码显示成汉字"><input type="checkbox" class="cn-toggle" /> 中文</label>
              <input class="cmdline" placeholder="命令行参数" title="程序的命令行参数（PSP:81h）" />
            </div>
            <div class="screen-wrap"><div class="screen" tabindex="0"></div></div>
          </div>
        </div>
      </section>

      <section class="pane cpu-pane">
        <div class="pane-head"><span id="cpu-title">寄存器</span><span class="spacer"></span><span id="cs-ip" class="mono note"></span></div>
        <div id="regs"></div>
        <div id="flags"></div>
        <div class="pane-head sub"><span>栈</span><span class="spacer"></span><span id="stack-note" class="mono note"></span></div>
        <div id="stack"></div>
      </section>

      <section class="pane info-pane">
        <div class="tabs">
          <button data-tab="vars" class="active">变量</button>
          <button data-tab="memory">内存</button>
          <button data-tab="serial">串口</button>
          <button data-tab="messages">消息 <span id="msg-count"></span></button>
          <button data-tab="files">虚拟磁盘</button>
        </div>
        <div class="tab-body" id="tab-vars"></div>
        <div class="tab-body hidden" id="tab-memory">
          <div class="mem-bar">
            <button id="mem-prev" title="上一页">◀</button>
            <input id="mem-addr" class="mono" value="DS:0000" title="地址：段:偏移，也可以写变量名或 ES:DI 之类的寄存器" />
            <button id="mem-next" title="下一页">▶</button>
          </div>
          <div id="memory" class="mono"></div>
        </div>
        <div class="tab-body hidden" id="tab-serial">
          <div class="serial-settings">
            <label>串口芯片
              <select id="uart-mode">
                <option value="real">真实 8250（写 THR 会覆盖未发出的字节）</option>
                <option value="buffered">虚拟串口（发送缓冲 + 硬件流控）</option>
              </select>
            </label>
            <label>接线方式 <select id="wiring"></select></label>
            <label class="check"><input type="checkbox" id="disk-latency" checked /> DOS 文件操作消耗时间（模拟磁盘）</label>
          </div>
          <div id="serial"></div>
        </div>
        <div class="tab-body hidden" id="tab-messages"></div>
        <div class="tab-body hidden" id="tab-files">
          <div class="mem-bar">
            <button id="file-upload">上传文件到虚拟磁盘</button>
            <span id="file-target" class="note"></span>
          </div>
          <div id="files"></div>
        </div>
      </section>
    </main>
  </div>
  <input type="file" id="file-input" accept=".asm,.inc,.txt" hidden />
  <input type="file" id="disk-input" hidden multiple />
  <script type="module" src="/src/ui/main.ts"></script>
</body>
</html>
