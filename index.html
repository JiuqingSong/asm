<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AsmPerfect 86</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23306998'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='14' font-weight='bold' fill='white' text-anchor='middle'%3E86%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <section id="launcher">
      <h1>AsmPerfect 86</h1>
      <p>选择启动方式。进入之前不会装载程序或配置虚拟 PC 环境。</p>
      <div class="start-cards">
        <button data-start="debug"><strong>直接调试</strong><span>选择设备和 BIOS / DOS 服务，编写并调试汇编程序</span></button>
        <button data-start="dual"><strong>双机对联</strong><span>使用默认配置，两台机器通过 COM1 串口连接</span></button>
        <button data-start="full"><strong>完整模拟</strong><span>选择设备，从软盘、硬盘或光盘启动操作系统</span></button>
      </div>
      <p id="startup-error" role="alert"></p>
    </section>
    <header class="toolbar">
      <div class="brand">AsmPerfect <span>86</span> <small id="version" class="version"></small></div>
      <div class="group">
        <button id="btn-home" title="停止当前会话，保存磁盘并返回启动选择页">启动选择</button>
        <span id="mode-name"></span>
        <select id="cpu" title="CPU 型号：决定虚拟 CPU 的速度；286/386 下 PUSH SP 等少数指令的行为与 8086 不同"></select>
      </div>
      <div class="group">
        <button id="btn-run" class="primary" title="运行 (F5)">▶ 运行</button>
        <button id="btn-pause" title="暂停 (F6)">❚❚ 暂停</button>
        <select id="speed" title="运行速度">
          <option value="-1" selected>原机速度</option>
          <option value="0">全速</option>
          <option value="100">每秒 100 步</option>
          <option value="20">每秒 20 步</option>
          <option value="5">每秒 5 步</option>
          <option value="1">每秒 1 步</option>
        </select>
      </div>
      <div class="group">
        <label class="check" title="串口鼠标捕获时全屏显示 DOS 屏幕，并申请将 Esc 传入虚拟机；右 Ctrl 释放（需要浏览器支持键盘锁定并授权）"><input type="checkbox" id="fullscreen-capture" /> 全屏捕获</label>
      </div>
      <div class="group">
        <label class="check" title="记录每条指令执行前的状态，才能后退。从磁盘启动时默认不记录（记录要多花约 20% 的时间）；随时可以勾上，从勾上那一刻开始记录"><input type="checkbox" id="record-history" /> 记录</label>
        <button id="btn-back" title="后退一步 (Ctrl+Shift+F11)">⟲ 后退</button>
        <button id="btn-step" title="单步进入 (F11)">↓ 单步</button>
        <button id="btn-over" title="单步跳过：CALL / INT / LOOP 整体执行 (F10)">↷ 跳过</button>
        <button id="btn-out" title="跳出：运行到当前子程序返回为止 (Shift+F11)">↑ 跳出</button>
        <button id="btn-reset" title="重新开始 (Ctrl+F5)">⟳ 重启</button>
        <button id="btn-cad" title="按下 Ctrl+Alt+Del（浏览器里按这三个键会被 Windows 系统截走，所以用这个按钮）。DOS 下是热启动；Windows 等程序会自己处理">Ctrl+Alt+Del</button>
        <button id="btn-power" title="关机：停止虚拟机，屏幕变黑，磁盘映像马上保存。从磁盘启动的 DOS 最好在 DOS 里运行 SHUTDOWN 关机（它会先把缓冲区写进磁盘）">⏻ 关机</button>
      </div>
      <div class="spacer"></div>
      <div id="status" class="status">就绪</div>
    </header>

    <main class="layout">
      <div class="col col-left">
      <section class="pane editor-pane">
        <div class="pane-head ed-head">
          <div id="ed-tabs" class="ed-tabs"></div>
          <div class="editor-tools">
            <button id="btn-new" title="清空当前编辑器和文件名">新建</button>
            <button id="btn-open" title="打开 .asm 文件到当前编辑器">打开</button>
            <select id="examples" title="打开示例程序">
              <option value="">示例程序…</option>
            </select>
            <button id="btn-save" title="保存当前编辑器为 .asm 文件">保存</button>
            <button id="btn-assemble" title="汇编并装载 (F7)">汇编</button>
            <label class="check" title="在每行代码后面显示地址和机器码"><input type="checkbox" id="show-bytes" /> 机器码</label>
          </div>
          <span id="dirty-note" class="note"></span>
          <div class="editor-actions">
            <button id="btn-export" title="根据当前源码生成 DOS EXE 或 COM，并下载到本机">生成 EXE/COM</button>
            <button class="max-btn" title="最大化 / 还原（也可以双击标题栏）">⛶</button>
          </div>
        </div>
        <div id="editor"></div>
      </section>
      <div class="splitter h" data-split="screen" title="拖动调整大小，双击恢复"></div>

      <section class="pane screen-pane">
        <div class="capture-hint">全屏捕获：右 Ctrl 释放鼠标并返回窗口；Esc 交给虚拟机（长按 Esc 可强制退出）。</div>
        <div class="screens">
          <div class="screen-box" data-i="0">
            <div class="pane-head">
              <span class="screen-title">DOS 屏幕</span>
              <span class="note screen-hint">点击屏幕后可以直接用键盘输入</span>
              <span class="spacer"></span>
              <label class="check" title="像 UCDOS 等中文 DOS 那样，把 GBK 编码显示成汉字"><input type="checkbox" class="cn-toggle" /> 中文</label>
              <input class="cmdline" placeholder="命令行参数" title="程序的命令行参数（PSP:81h）" />
              <button class="max-btn" title="最大化 / 还原（也可以双击标题栏）">⛶</button>
            </div>
            <div class="screen-wrap"><div class="screen" tabindex="0"></div></div>
          </div>
          <div class="screen-box hidden" data-i="1">
            <div class="pane-head">
              <span class="screen-title">B 机屏幕</span>
              <span class="spacer"></span>
              <label class="check" title="像 UCDOS 等中文 DOS 那样，把 GBK 编码显示成汉字"><input type="checkbox" class="cn-toggle" /> 中文</label>
              <input class="cmdline" placeholder="命令行参数" title="程序的命令行参数（PSP:81h）" />
              <button class="max-btn" title="最大化 / 还原（也可以双击标题栏）">⛶</button>
            </div>
            <div class="screen-wrap"><div class="screen" tabindex="0"></div></div>
          </div>
        </div>
      </section>
      </div>

      <div class="splitter v" data-split="right" title="拖动调整大小，双击恢复"></div>

      <div class="col col-right">
      <section class="pane cpu-pane">
        <div class="pane-head"><span id="cpu-title">寄存器</span><span class="spacer"></span><span id="cs-ip" class="mono note"></span><button class="max-btn" title="最大化 / 还原（也可以双击标题栏）">⛶</button></div>
        <div id="regs"></div>
        <div id="flags"></div>
        <div class="pane-head sub"><span>栈</span><span class="spacer"></span><span id="stack-note" class="mono note"></span></div>
        <div id="stack"></div>
      </section>
      <div class="splitter h" data-split="info" title="拖动调整大小，双击恢复"></div>

      <section class="pane info-pane">
        <div class="tabs">
          <button data-tab="vars" class="active">变量</button>
          <button data-tab="memory">内存</button>
          <button data-tab="disasm">反汇编</button>
          <button data-tab="serial">串口</button>
          <button data-tab="messages">消息 <span id="msg-count"></span></button>
          <button data-tab="files">虚拟磁盘</button>
          <span class="spacer"></span>
          <button class="max-btn" title="最大化 / 还原（也可以双击标题栏）">⛶</button>
        </div>
        <div class="tab-body" id="tab-vars"></div>
        <div class="tab-body hidden" id="tab-memory">
          <div class="mem-bar">
            <button id="mem-prev" title="上一页">◀</button>
            <input id="mem-addr" class="mono" value="DS:0000" title="地址：段:偏移，也可以写变量名或 ES:DI 之类的寄存器" />
            <button id="mem-next" title="下一页">▶</button>
          </div>
          <div id="memory" class="mono"></div>
        </div>
        <div class="tab-body hidden mono" id="tab-disasm"></div>
        <div class="tab-body hidden" id="tab-serial">
          <div class="serial-settings">
            <label>串口芯片
              <select id="uart-mode">
                <option value="real">真实 8250（写 THR 会覆盖未发出的字节）</option>
                <option value="buffered">虚拟串口（发送缓冲 + 硬件流控）</option>
              </select>
            </label>
            <label>接线方式 <select id="wiring"></select></label>
            <label class="check"><input type="checkbox" id="disk-latency" checked /> DOS 文件操作消耗时间（模拟磁盘）</label>
          </div>
          <div id="serial"></div>
        </div>
        <div class="tab-body hidden" id="tab-messages"></div>
        <div class="tab-body hidden" id="tab-files">
          <div class="drives-head dos-files">文件：模拟的 DOS 直接读写的文件（运行汇编程序、EXE/COM 时使用）</div>
          <div class="mem-bar dos-files">
            <button id="file-upload">上传文件到虚拟磁盘</button>
            <span id="file-target" class="note"></span>
          </div>
          <div id="files" class="dos-files"></div>
          <div id="drives"></div>
        </div>
      </section>
      </div>
    </main>
  </div>
  <dialog id="startup-config" class="startup-dialog">
    <form>
      <h2 id="config-title"></h2>
      <p>CPU 和基础内存始终保留。取消设备后不会自动补装；依赖它们的程序可能无法工作。</p>
      <label>CPU <select id="config-cpu"></select></label>
      <div id="config-options"></div>
      <label id="config-images-option" class="check">
        <input type="checkbox" id="config-images" /> 显示磁盘映像文件系统（软盘、硬盘和光驱）
      </label>
      <p id="config-warnings" class="config-warnings"></p>
      <div class="dialog-actions">
        <button type="button" id="config-defaults">恢复默认</button>
        <span class="spacer"></span>
        <button type="button" id="config-cancel">取消</button>
        <button type="submit" class="primary">进入环境</button>
      </div>
    </form>
  </dialog>
  <dialog id="boot-choice" class="startup-dialog">
    <h2>选择启动设备</h2>
    <p>可以先在下方装入或更换映像。重启会再次询问；客体热启动沿用本次启动源。</p>
    <div class="dialog-actions">
      <button data-boot="0">从 A: 启动</button>
      <button data-boot="128">从 C: 启动</button>
      <button data-boot="224">从光盘启动</button>
      <span class="spacer"></span>
      <button id="boot-cancel">取消</button>
    </div>
    <p id="boot-error" class="config-warnings" role="alert"></p>
    <div id="boot-media"></div>
  </dialog>
  <input type="file" id="file-input" accept=".asm,.inc,.txt" hidden />
  <input type="file" id="disk-input" hidden multiple />
  <script type="module" src="/src/ui/main.ts"></script>
</body>
</html>
